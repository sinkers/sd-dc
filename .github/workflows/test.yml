name: tests

on:
  push:
    branches: [main]
  pull_request:

# CI runs credential-free, and runs exactly what run-tests.sh runs, so the two
# cannot drift. The licensed data (AS/NZS tables, vendor catalogues) is not in
# the repo: the reference cable engine and the synthetic suite run on invented
# fixtures, which proves assembly and method, not the tabulated values; the
# service-engine value suites skip with exit 0 and are run locally against the
# real data. See CALCS.md for what each suite verifies.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # digital-twin and liquid-twin are packages whose tests import them;
      # piping and trays need only pytest, and jsonschema for one API test.
      - name: Install
        run: pip install -e './digital-twin[dev]' -e './liquid-twin[dev]' jsonschema

      - name: Every suite
        run: ./run-tests.sh

  # feeder.py and its service are standard library only, with 3.9 as the
  # measured floor. The rest of the repo needs 3.10.
  cable-sizing-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: cable-sizing — service engine on Python 3.9
        working-directory: cable-sizing
        run: |
          python3 -c "import feeder, service, server, mcp_server"
          python3 test_synthetic.py
          python3 test_feeder.py
          python3 test_api.py
